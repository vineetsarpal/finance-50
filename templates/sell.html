{% extends "layout.html" %}

{% block title %}
    Sell
{% endblock %}

{% block main %}
    <form action="/sell" method="post">

        <select class="form-select mb-3 mx-auto w-auto" name="symbol" aria-label="Default select example">
            <option selected disabled>Select Stock</option>
            {% for stock in stocks %}
                <option value="{{ stock.symbol }}">{{ stock.symbol }}</option>
            {% endfor %}
        </select>

        <input autocomplete="off" autofocus class="form-control mx-auto w-auto mb-3" name="shares" placeholder="Number of shares" type="number">

        <button class="btn btn-primary mb-3" type="submit">Sell</button>
    </form>
{% endblock %}
