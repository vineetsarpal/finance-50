{% extends "layout.html" %}

{% block title %}
    Quoted
{% endblock %}

{% block main %}
    <div class="card text-bg-primary mb-3 mx-auto" style="max-width: 18rem;">
        <div class="card-header">{{ symbol }}</div>
        <div class="card-body">
            <h5 class="card-title">{{ name }}</h5>
            <p class="card-text">{{ usd(price) }}</p>
        </div>
    </div>
{% endblock %}
